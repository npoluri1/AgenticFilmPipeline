services:
  studio:
    build:
      context: .
      dockerfile: Dockerfile
    image: ruthambhara/agentic-film-studio:3.0.0
    container_name: ruthambhara-studio
    ports:
      - "8080:8080"
    environment:
      AFP_ENV: production
      AFP_SCOPE: sample
      AFP_RENDER_MEDIA: "1"
      AFP_RENDER_VIDEO: "1"
      AFP_TTS_BACKEND: wav          # switch to `edge` for free neural Telugu voices
      AFP_USE_OLLAMA: "0"           # opt in only when the ollama service is up
      OLLAMA_BASE_URL: http://ollama:11434
      AFP_CORS_ORIGINS: "*"
    volumes:
      - ./output:/app/output
      - ./data:/app/data:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Optional local LLM.  Enable with:  docker compose --profile llm up
  ollama:
    image: ollama/ollama:latest
    profiles: ["llm"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "24h"
    # Uncomment to expose an NVIDIA GPU (requires the NVIDIA container toolkit).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Optional advanced Next.js UI.  Enable with: docker compose --profile web up
  web:
    image: node:20-alpine
    profiles: ["web"]
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8080"
      API_PROXY_TARGET: "http://studio:8080"
    command: sh -c "npm install && npm run dev"

volumes:
  ollama_data:
